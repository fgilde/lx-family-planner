name: Bug report
description: Something does not work as expected.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Do not include passwords, tokens, private keys or personal family data.

  - type: input
    id: version
    attributes:
      label: LX version
      description: Shown in family settings and system status.
      placeholder: "for example 1.16.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does the problem occur?
      options:
        - Desktop browser
        - Phone browser
        - Tablet browser
        - Android app
        - Tablet mode
        - Docker / server
        - Nextcloud / Family Cloud
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Briefly describe what you saw.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the calendar
        2. Select an event
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context or screenshots
      description: Remove names, addresses and other private information before uploading.

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and private family data from text and screenshots.
          required: true
