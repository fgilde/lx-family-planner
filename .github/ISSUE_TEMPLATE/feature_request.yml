name: Feature request
description: Suggest a family-focused feature, integration or improvement.
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: situation
    attributes:
      label: Which everyday situation should become easier?
      placeholder: Tell us when and for whom this would be useful.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would a good solution look like?
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      multiple: true
      options:
        - Adults
        - Children
        - Teenagers
        - Grandparents
        - Care / managed profiles
        - Pet profiles
        - Everyone

  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today instead?

  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This idea fits a private, self-hosted family planner.
          required: true
