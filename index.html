<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LX Family · Private Family OS</title>
    <meta name="description" content="LX Family ist euer privates Family OS für Kalender, Aufgaben, Einkauf, Essen, Chat und Erinnerungen – selbst gehostet auf eurem Server." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#246b58" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LX Family" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // A production PWA may keep its offline worker. In local Vite sessions
      // it would cache source modules and mix old/new React contexts instead.
      if (import.meta.env.DEV && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
